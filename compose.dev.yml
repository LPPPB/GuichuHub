name: kichiku-v3-dev

x-backend-environment: &backend-environment
  KICHU_ENV: development
  KICHU_COOKIE_PATH: /app/runtime/dev/private/bilibili_cookie.json
  KICHU_LOG_DIR: /app/runtime/dev/logs

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kichu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kichu"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    networks: [core]
    secrets:
      - postgres_superuser_password
      - postgres_api_password
      - postgres_worker_password
      - postgres_migration_password
      - postgres_backup_password
    volumes:
      - ./runtime/dev/postgres:/var/lib/postgresql/data
      - ./ops/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro

  migrate:
    profiles: ["maintenance"]
    build:
      context: ./backend
      target: builder
    command: ["/app/.venv/bin/python", "-m", "scripts.migrate"]
    environment:
      KICHU_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]
    secrets: [migration_database_url]

  api:
    build:
      context: ./backend
      target: builder
    command:
      - /app/.venv/bin/flask
      - --app
      - api_entrypoint:app
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug
    environment:
      <<: *backend-environment
      KICHU_API_DATABASE_URL_FILE: /run/secrets/api_database_url
      HTTP_PROXY: http://api-egress:8080
      HTTPS_PROXY: http://api-egress:8080
      NO_PROXY: localhost,127.0.0.1,postgres
    depends_on:
      - api-egress
    init: true
    logging: *default-logging
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./runtime/dev:/app/runtime/dev
    networks: [core]
    secrets: [api_database_url]

  api-egress:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    entrypoint: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
    networks: [core, egress]
    volumes:
      - ./ops/egress/squid.conf:/etc/squid/squid.conf:ro

  worker:
    build:
      context: ./backend
      target: builder
    command: ["/app/.venv/bin/python", "worker_entrypoint.py"]
    environment:
      <<: *backend-environment
      KICHU_WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
    init: true
    logging: *default-logging
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./runtime/dev:/app/runtime/dev
    networks:
      - core
      - egress
    secrets: [worker_database_url]

  frontend:
    build:
      context: ./frontend
      target: builder
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:5000
    init: true
    logging: *default-logging
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [core]

volumes:
  backend_venv:
  frontend_node_modules:

networks:
  core:
    internal: true
  egress:

secrets:
  postgres_superuser_password:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/postgres_superuser_password
  postgres_api_password:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/postgres_api_password
  postgres_worker_password:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/postgres_worker_password
  postgres_migration_password:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/postgres_migration_password
  postgres_backup_password:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/postgres_backup_password
  api_database_url:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/api_database_url
  worker_database_url:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/worker_database_url
  migration_database_url:
    file: ${KICHU_DEV_SECRETS_DIR:-./runtime/dev/secrets}/migration_database_url
