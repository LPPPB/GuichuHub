server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Vite assets have content hashes; missing files must not return the SPA.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Stable icon URLs must be revalidated, including an old cached favicon.
    location = /favicon.ico {
        types { image/x-icon ico; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* ^/(favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ── SPA 路由兜底：非静态请求交给前端 Router ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
