name: frontend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --maxWorkers=2
      - name: Verify public page cache, publishing and HTTP behavior
        run: node --test public-pages/*.test.mjs
      - name: Build production frontend
        run: npm run build
      - name: Validate crawlable HTML and generated sitemap
        run: node scripts/verify-seo.mjs
      - name: Install layout browser
        run: npx playwright-core install --with-deps chromium
      - name: Verify responsive layout and radar interactions
        run: |
          LAYOUT_COLOR_SCHEME=light node scripts/verify-ranking-layout.mjs
          LAYOUT_COLOR_SCHEME=dark node scripts/verify-ranking-layout.mjs
      - name: Verify brand navigation across breakpoints and themes
        run: node scripts/verify-navigation-layout.mjs
      - name: Verify dashboard ranking layout and complete ranking navigation
        run: node scripts/verify-dashboard-ranking.mjs
      - name: Verify observed counts and automatic curve refresh
        run: node scripts/verify-observation-consistency.mjs

  development-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify development credential and data protection
        run: node --test ops/dev/dev.test.mjs
