name: kichiku-v3

x-backend-environment: &backend-environment
  KICHU_ENV: production
  KICHU_TRUST_PROXY: "1"
  KICHU_COOKIE_PATH: /data/private/bilibili_cookie.json
  KICHU_LOG_DIR: /logs

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kichu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kichu"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      - core
    restart: unless-stopped
    secrets:
      - postgres_superuser_password
      - postgres_api_password
      - postgres_worker_password
      - postgres_migration_password
      - postgres_backup_password
    volumes:
      - ${KICHU_HOST_POSTGRES_DIR}:/var/lib/postgresql/data
      - ./ops/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro

  migrate:
    profiles: ["maintenance"]
    build:
      context: ./backend
    command: ["python", "-m", "scripts.migrate"]
    environment:
      KICHU_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - core
    secrets:
      - migration_database_url

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - api
      - frontend
    environment:
      KICHU_DOMAIN: ${KICHU_DOMAIN:-localhost}
    logging: *default-logging
    networks:
      - edge
      - core
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ./frontend
    logging: *default-logging
    networks:
      - core
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --threads=4
      - --access-logfile=-
      - --error-logfile=-
      - api_entrypoint:app
    environment:
      <<: *backend-environment
      KICHU_WRITE_TOKEN_FILE: /run/secrets/write_token
      KICHU_API_DATABASE_URL_FILE: /run/secrets/api_database_url
      KICHU_COOKIE_WRITES_ENABLED: "0"
      HTTP_PROXY: http://api-egress:8080
      HTTPS_PROXY: http://api-egress:8080
      NO_PROXY: localhost,127.0.0.1,postgres
    depends_on:
      - api-egress
    init: true
    logging: *default-logging
    networks:
      - core
    restart: unless-stopped
    volumes:
      - ${KICHU_HOST_DATA_DIR:-../data}/private:/data/private:ro
      - ${KICHU_HOST_LOG_DIR:-../logs}:/logs
    secrets:
      - write_token
      - api_database_url

  api-egress:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    entrypoint: ["squid", "-N", "-f", "/etc/squid/squid.conf"]
    networks: [core, egress]
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./ops/egress/squid.conf:/etc/squid/squid.conf:ro

  worker:
    build:
      context: ./backend
    command: ["python", "worker_entrypoint.py"]
    environment:
      <<: *backend-environment
      KICHU_COOKIE_WRITES_ENABLED: "1"
      KICHU_WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
    init: true
    logging: *default-logging
    networks:
      - core
      - egress
    restart: unless-stopped
    volumes:
      - ${KICHU_HOST_DATA_DIR:-../data}/private:/data/private
      - ${KICHU_HOST_LOG_DIR:-../logs}:/logs
    secrets:
      - worker_database_url

  backup:
    profiles: ["maintenance"]
    build:
      context: ./backend
    command:
      - python
      - /opt/kichu/backup_postgres.py
    environment:
      KICHU_BACKUP_DIR: /backups
      KICHU_BACKUP_DATABASE_URL_FILE: /run/secrets/backup_database_url
      KICHU_GIT_TAG: ${KICHU_GIT_TAG:?set the verified release Git tag}
      KICHU_IMAGE_DIGEST: ${KICHU_IMAGE_DIGEST:?set the built backend image digest}
    init: true
    logging: *default-logging
    networks:
      - core
    volumes:
      - ./ops/backup/backup_postgres.py:/opt/kichu/backup_postgres.py:ro
      - ${KICHU_HOST_BACKUP_DIR:-../backups}:/backups
    secrets:
      - backup_database_url

networks:
  edge:
  core:
    internal: true
  egress:

secrets:
  write_token:
    file: ${KICHU_HOST_WRITE_TOKEN_FILE:-../secrets/write_token}
  postgres_superuser_password:
    file: ${KICHU_HOST_POSTGRES_SUPERUSER_PASSWORD_FILE}
  postgres_api_password:
    file: ${KICHU_HOST_POSTGRES_API_PASSWORD_FILE}
  postgres_worker_password:
    file: ${KICHU_HOST_POSTGRES_WORKER_PASSWORD_FILE}
  postgres_migration_password:
    file: ${KICHU_HOST_POSTGRES_MIGRATION_PASSWORD_FILE}
  postgres_backup_password:
    file: ${KICHU_HOST_POSTGRES_BACKUP_PASSWORD_FILE}
  api_database_url:
    file: ${KICHU_HOST_API_DATABASE_URL_FILE}
  worker_database_url:
    file: ${KICHU_HOST_WORKER_DATABASE_URL_FILE}
  migration_database_url:
    file: ${KICHU_HOST_MIGRATION_DATABASE_URL_FILE}
  backup_database_url:
    file: ${KICHU_HOST_BACKUP_DATABASE_URL_FILE}

volumes:
  caddy_config:
  caddy_data:
